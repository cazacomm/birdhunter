name: Blog — article automatique

# Publie un article par semaine, le lundi à 9 h UTC (11 h en France l'été,
# 10 h l'hiver). Déclenchable aussi à la main depuis l'onglet Actions.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test à blanc (n'écrit rien, ne publie rien)"
        type: boolean
        default: false
      rewrite:
        description: "Réécrire un article existant : saisir son slug (laisser vide sinon)"
        type: string
        default: ""

# Le job pousse un commit sur main : il lui faut le droit d'écriture.
permissions:
  contents: write

# Deux exécutions simultanées écriraient dans les mêmes fichiers.
concurrency:
  group: blog-auto
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install --quiet openai

      - name: Identité git
        # Placée ici, avant le réapprovisionnement : le commit des sujets en a
        # besoin. L'étape de publication finale s'appuie sur la même identité.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Réapprovisionnement des sujets
        # Ignoré en test à blanc et en réécriture : dans ces deux cas on ne
        # consomme pas la réserve, donc rien à reconstituer.
        if: inputs.dry_run != true && inputs.rewrite == ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          python3 scripts/generate-article.py --topics-only
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "::warning::Réapprovisionnement des sujets échoué (code $CODE). Le job continue avec la réserve existante."
          fi
          exit 0

      - name: Push des nouveaux sujets
        # Poussé AVANT la rédaction : si l'article échoue ensuite, le lot de
        # sujets déjà produit reste acquis sur le remote.
        if: inputs.dry_run != true && inputs.rewrite == ''
        run: |
          set +e
          git fetch origin "${{ github.ref_name }}" --quiet
          AHEAD=$(git rev-list --count "origin/${{ github.ref_name }}..HEAD" 2>/dev/null || echo 0)
          if [ "$AHEAD" = "0" ]; then
            echo "::notice::Aucun nouveau sujet à pousser."
            exit 0
          fi
          git push origin "HEAD:${{ github.ref_name }}"
          if [ $? -ne 0 ]; then
            echo "::warning::Push des sujets échoué. Le job continue."
          else
            echo "::notice::$AHEAD commit(s) de sujets poussé(s)."
          fi
          exit 0

      - name: Générer l'article
        id: generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.rewrite }}" ]; then ARGS="$ARGS --rewrite ${{ inputs.rewrite }}"; fi

          python3 scripts/generate-article.py $ARGS
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

          # 0  = article généré        → on publie
          # 78 = plus aucun sujet      → succès sans publication
          # 1  = erreur                → le job échoue, rien n'est poussé
          case $CODE in
            0)  echo "publier=true"  >> "$GITHUB_OUTPUT" ;;
            78) echo "publier=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Tous les sujets de BLOG_WORKFLOW.md ont été publiés. Ajoutez des lignes au tableau pour relancer la production." ;;
            *)  echo "publier=false" >> "$GITHUB_OUTPUT"
                echo "::error::Génération échouée (code $CODE) — aucun fichier modifié."
                exit $CODE ;;
          esac

      - name: Publier l'article
        if: steps.generation.outputs.publier == 'true' && inputs.dry_run != true
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::Aucune modification à publier."
            exit 0
          fi
          git add -A
          if [ -n "${{ inputs.rewrite }}" ]; then
            git commit -m "chore(blog): réécriture de ${{ inputs.rewrite }} du $(date -u +%Y-%m-%d)"
          else
            git commit -m "chore(blog): article auto du $(date -u +%Y-%m-%d)"
          fi
          git push
          echo "::notice::Article publié. GitHub Pages met le site à jour en 1 à 2 minutes."

      - name: Récapitulatif
        if: always()
        run: |
          echo "### Blog — article automatique" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Code de sortie du script : \`${{ steps.generation.outputs.code }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Code | Signification |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 0 | Article généré et publié |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 78 | Aucun sujet restant — rien à publier |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 1 | Erreur — aucun fichier modifié |" >> "$GITHUB_STEP_SUMMARY"
