<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page introuvable – Bird Hunter 65</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#424D2D" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    body{padding-top:0}
    .erreur{
      min-height:100vh;display:grid;place-items:center;text-align:center;
      padding:2rem 1rem;
      background:var(--vert-fonce) url('/imagesbirdhunter/hero.jpg') center/cover no-repeat;
      position:relative;
    }
    .erreur::after{content:"";position:absolute;inset:0;background:rgba(25,30,18,.76)}
    .erreur-contenu{position:relative;z-index:2;max-width:620px}
    .erreur img{height:96px;width:auto;margin:0 auto 1.6rem;border-radius:50%;background:var(--creme)}
    .erreur h1{color:#fff;font-size:clamp(2rem,6vw,3.2rem);margin-bottom:1rem}
    .erreur p{color:#E8E4D8;font-size:1.1rem;margin-bottom:2rem}
  </style>
</head>
<body>
  <main class="erreur">
    <div class="erreur-contenu">
      <img src="/imagesbirdhunter/logo.jpg" alt="Logo Bird Hunter" width="96" height="96" />
      <h1>Cette page n’existe pas</h1>
      <p>Le lien que vous avez suivi n’est plus valide. Revenez à l’accueil, ou appelez-nous directement, c’est souvent le plus rapide.</p>
      <div class="groupe-btn centre">
        <a href="/" class="btn btn-principal">Retour à l’accueil</a>
        <a href="tel:+33609276288" class="btn btn-contour-blanc">Appeler le 06 09 27 62 88</a>
      </div>
    </div>
  </main>
</body>
</html>
